name: Build MercadoList

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: unzip -q MercadoList.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Pruebas del catálogo
        run: gradle -p MercadoList :app:testDebugUnitTest --stacktrace

      - name: Compilar APK
        run: gradle -p MercadoList :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MercadoList-debug-apk
          path: MercadoList/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
