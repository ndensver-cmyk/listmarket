name: Build MercadoList

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: unzip -q MercadoList.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Pruebas del catálogo
        run: gradle -p MercadoList :app:testDebugUnitTest --stacktrace

      - name: Compilar APK
        run: gradle -p MercadoList :app:assembleDebug --stacktrace

      - name: Renombrar APK
        run: cp MercadoList/app/build/outputs/apk/debug/app-debug.apk MercadoList.apk

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MercadoList build ${{ github.run_number }}
          files: MercadoList.apk
